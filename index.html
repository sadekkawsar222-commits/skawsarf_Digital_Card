<style>
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;
    padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#fff;background:#8f0007;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }

  /* ---------- background: crimson + white atmosphere ---------- */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
    background:linear-gradient(155deg,#d40009 0%,#a30008 46%,#5a0005 100%);
    animation:fade .5s ease-out both}
  .bg i{position:absolute;border-radius:50%;display:block}
  .bg .a{left:-20%;top:-25%;width:75vmax;height:75vmax;
    background:radial-gradient(closest-side,rgba(255,255,255,.92),rgba(255,220,220,.45) 45%,rgba(255,255,255,0) 72%)}
  .bg .b{right:-15%;top:10%;width:55vmax;height:55vmax;
    background:radial-gradient(closest-side,rgba(255,58,64,.55),rgba(255,58,64,0) 70%)}
  .bg .c{right:-10%;bottom:-25%;width:60vmax;height:60vmax;
    background:radial-gradient(closest-side,rgba(255,255,255,.32),rgba(255,255,255,0) 70%)}
  .bg .d{inset:0;border-radius:0;
    background:radial-gradient(120% 90% at 50% 110%,rgba(40,0,3,.55),rgba(40,0,3,0) 60%)}

  /* ---------- glass card ---------- */
  .wrap{width:100%;max-width:440px;perspective:1400px;animation:cardIn .6s cubic-bezier(.22,1,.36,1) both}
  .card{
    --rx:0deg;--ry:0deg;--hx:30%;--hy:15%;--sx:0px;
    position:relative;overflow:hidden;border-radius:44px;padding:30px 16px 38px;
    transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;will-change:transform;
    background:linear-gradient(145deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,.08) 42%,rgba(255,255,255,.05) 100%),rgba(96,0,8,.22);
    -webkit-backdrop-filter:blur(30px) saturate(180%) brightness(1.06);
            backdrop-filter:blur(30px) saturate(180%) brightness(1.06);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 1px 0 0 rgba(255,255,255,.28),
      inset 0 -1px 0 rgba(255,255,255,.06),
      inset 0 0 40px rgba(255,255,255,.05),
      0 0 0 .5px rgba(255,255,255,.22),
      0 40px 90px -30px rgba(38,0,3,.6),
      0 12px 30px -18px rgba(38,0,3,.4);
  }
  @media (min-width:520px){.card{border-radius:52px;padding:38px 40px 44px}}

  .card .layer{position:absolute;inset:0;pointer-events:none}
  .card .top{background:radial-gradient(70% 45% at 12% 0%,rgba(255,255,255,.22),rgba(255,255,255,0) 70%)}
  .card .hl{opacity:0;background:radial-gradient(520px circle at var(--hx) var(--hy),rgba(255,255,255,.20),rgba(255,255,255,0) 62%)}
  .card.fine .hl{opacity:1}
  .card .sheen{inset:-40px auto -40px -30%;width:60%;opacity:.5;transform:translateX(var(--sx)) rotate(-18deg);
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.10) 50%,rgba(255,255,255,0))}

  /* watermark (opt-in: set CONFIG.watermark) */
  .wm{position:absolute;right:-12%;bottom:-8%;width:68%;aspect-ratio:1;opacity:.07;
      background:center/contain no-repeat;filter:grayscale(1) brightness(3);pointer-events:none;display:none}
  .wm.on{display:block}

  .content{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}

  /* ---------- entrance ---------- */
  .reveal{opacity:0;transform:translateY(8px);animation:rise .4s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes cardIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

  /* ---------- profile ---------- */
  .photo{position:relative;width:164px;height:164px;border-radius:50%;padding:4px;
    background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.45) 50%,rgba(255,255,255,.8));
    box-shadow:0 16px 36px -12px rgba(40,0,3,.65),0 0 0 1px rgba(255,255,255,.25),inset 0 1px 0 rgba(255,255,255,.6)}
  .photo .in{width:100%;height:100%;border-radius:50%;overflow:hidden;background:rgba(124,0,6,.6)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.05) saturate(1.06) brightness(1.03)}
  .photo .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:500;letter-spacing:-.02em;color:rgba(255,255,255,.92);
    background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.28),rgba(255,255,255,0) 60%),linear-gradient(160deg,#c1000a,#6d0006)}
  
  @media (min-width:520px){.photo{width:188px;height:188px}}

  /* ---------- icon row: one line ---------- */
  nav{margin-top:24px;width:100%}
  nav ul{list-style:none;margin:0;padding:0;display:flex;justify-content:center;gap:4px;width:100%}
  nav li{position:relative;flex:1 1 0;min-width:0;max-width:40px}
  nav a{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:44px;border-radius:999px;
    color:rgba(255,255,255,.82);text-decoration:none;outline:none;-webkit-tap-highlight-color:transparent;
    transition:transform .3s ease,color .3s ease,box-shadow .3s ease,background .3s ease}
  nav a svg{width:20px;height:20px;display:block}
  nav a:active{transform:scale(.94)}
  nav a:focus-visible{box-shadow:0 0 0 2px rgba(255,255,255,.75);color:#fff}
  @media (hover:hover){
    nav a:hover{transform:scale(1.12);color:#fff;background:rgba(255,255,255,.14);box-shadow:0 0 22px rgba(255,255,255,.28)}
    nav a::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);
      white-space:nowrap;font-size:11px;font-weight:500;color:rgba(255,255,255,.92);background:rgba(0,0,0,.38);
      -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:4px 10px;border-radius:999px;
      opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:5}
    nav a:hover::after,nav a:focus-visible::after{opacity:1}
  }

  /* ---------- name: big, then small company + role ---------- */
  h1{margin:34px 0 0;font-weight:800;line-height:.92;letter-spacing:-.045em;
    font-size:clamp(2.45rem,11.5vw,4.05rem);padding-bottom:4px;
    background:linear-gradient(180deg,#fff 0%,#fff 45%,#ffd3d6 100%);-webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 18px rgba(255,255,255,.38)) drop-shadow(0 2px 3px rgba(40,0,3,.35))}
  h1 span{display:block}
  .rule{display:block;width:72px;height:2px;border-radius:2px;margin-top:14px;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85),rgba(255,255,255,0))}
  .company{margin:16px 0 0;display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:.92rem;font-weight:500;letter-spacing:-.01em;color:rgba(255,255,255,.9)}
  .company img,.company .mono{width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,.88);object-fit:contain;padding:1px;flex:none}
  .company .mono{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#a30008;padding:0}
  .role{margin:4px 0 0;font-size:.82rem;font-weight:400;letter-spacing:-.005em;color:rgba(255,255,255,.66)}

  footer{margin-top:30px;width:100%}
  footer .div{height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.28) 30%,rgba(255,255,255,.28) 70%,rgba(255,255,255,0))}
  footer blockquote{margin:22px 0 0;font-size:.95rem;font-weight:300;font-style:italic;letter-spacing:-.005em;color:rgba(255,255,255,.62)}
  figure{margin:0}

  @media (prefers-reduced-motion:reduce){
    .reveal,.wrap,.bg{animation:none;opacity:1;transform:none}
  }
</style>
</head>

<div class="bg" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>

<main class="wrap" id="wrap">
  <article class="card" id="card" aria-label="Digital card">
    <div class="layer top" aria-hidden="true"></div>
    <div class="layer hl" aria-hidden="true"></div>
    <div class="layer sheen" aria-hidden="true"></div>
    <div class="wm" id="wm" aria-hidden="true"></div>

    <div class="content">
      <div class="photo reveal" id="photo"></div>
      <nav aria-label="Social and contact links"><ul id="links"></ul></nav>
      <h1 class="reveal" id="name"></h1>
      <span class="rule reveal" aria-hidden="true"></span>
      <p class="company reveal" id="company"></p>
      <p class="role reveal" id="role"></p>
      <footer class="reveal">
        <div class="div" aria-hidden="true"></div>
        <figure><blockquote id="quote"></blockquote></figure>
      </footer>
    </div>
  </article>
</main>

const withProto = u => /^https?:\/\//i.test(u) ? u : "https://" + u;
const digits = v => String(v).replace(/\D/g, "");
const dial = v => String(v).replace(/[^\d+]/g, "");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const c = CONFIG, s = c.socials;
document.title = `${c.name} | ${c.company.name}`;

/* photo */
const photo = $("photo");
if (c.photo) {
  photo.innerHTML = `<div class="in"><img alt="Portrait of ${esc(c.name)}" src="${esc(c.photo)}" draggable="false"></div>`;
  photo.querySelector("img").onerror = () => { photo.innerHTML = `<div class="in"><div class="ini" role="img" aria-label="${esc(c.name)} initials">${esc(c.initials)}</div></div>`; };
} else {
  photo.innerHTML = `<div class="in"><div class="ini" role="img" aria-label="${esc(c.name)} initials">${esc(c.initials)}</div></div>`;
}

/* icon row: all eight on one line */
const links = [
  ["Facebook",  withProto(s.facebook),  ICON.facebook,  true],
  ["LinkedIn",  withProto(s.linkedin),  ICON.linkedin,  true],
  ["Instagram", withProto(s.instagram), ICON.instagram, true],
  ["WhatsApp",  "https://wa.me/" + digits(s.phone), ICON.whatsapp, true],
  ["Call",      "tel:" + dial(s.phone), ICON.phone,     false],
  ["Gmail",     "mailto:" + s.gmail,    ICON.mail,      false],
  ["Work email","mailto:" + s.workEmail,ICON.at,        false],
  [c.company.name + " website", withProto(c.company.website), ICON.globe, true]
];
$("links").innerHTML = links.map(([label, href, svg, ext]) =>
  `<li class="reveal"><a href="${esc(href)}" aria-label="${esc(label)}" data-tip="${esc(label)}"${ext ? ' target="_blank" rel="noopener noreferrer"' : ""}>${svg}</a></li>`
).join("");

/* name: first name(s) on line one, surname on line two */
const parts = c.name.trim().split(/\s+/);
$("name").innerHTML = parts.length > 1
  ? `<span>${esc(parts.slice(0, -1).join(" "))}</span><span>${esc(parts[parts.length - 1])}</span>`
  : `<span>${esc(c.name)}</span>`;

/* company + role */
$("company").innerHTML =
  `<img alt="" src="${esc(c.company.logo)}" width="18" height="18" id="logo"><span>${esc(c.company.name)}</span>`;
$("logo").onerror = function () {
  const m = document.createElement("span"); m.className = "mono"; m.setAttribute("aria-hidden", "true");
  m.textContent = c.company.monogram; this.replaceWith(m);
};
$("role").textContent = c.role;
$("quote").textContent = "\u201C" + c.quote + "\u201D";

/* watermark */
if (c.watermark) { const w = $("wm"); w.style.backgroundImage = `url("${c.watermark}")`; w.classList.add("on"); }

/* entrance: staggered, about 1 second in total */
(function () {
  let t = 150;
  const seq = document.querySelectorAll(".card .reveal");
  seq.forEach(el => {
    el.style.animationDelay = t + "ms";
    t += el.closest("ul") ? 30 : 55;
  });
})();

/* glass response to the cursor (desktop only, off for touch and reduced motion) */
(function () {
  const card = $("card"), wrap = $("wrap");
  const fine = matchMedia("(hover:hover) and (pointer:fine)").matches;
  const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
  if (!fine || still) return;
  card.classList.add("fine");
  let tx = 0, ty = 0, cx = 0, cy = 0, raf = null;
  const loop = () => {
    cx += (tx - cx) * .08; cy += (ty - cy) * .08;
    card.style.setProperty("--ry", (cx * 3).toFixed(3) + "deg");   /* max 1.5deg */
    card.style.setProperty("--rx", (-cy * 3).toFixed(3) + "deg");
    card.style.setProperty("--hx", (50 + cx * 60).toFixed(1) + "%");
    card.style.setProperty("--hy", (35 + cy * 60).toFixed(1) + "%");
    card.style.setProperty("--sx", (-cx * 36).toFixed(1) + "px");
    raf = (Math.abs(tx - cx) + Math.abs(ty - cy) > .001) ? requestAnimationFrame(loop) : null;
  };
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
  wrap.addEventListener("pointermove", e => {
    const r = card.getBoundingClientRect();
    tx = (e.clientX - r.left) / r.width - .5;
    ty = (e.clientY - r.top) / r.height - .5;
    kick();
  });
  wrap.addEventListener("pointerleave", () => { tx = 0; ty = 0; kick(); });
})();
</script>
</body>
</html>
